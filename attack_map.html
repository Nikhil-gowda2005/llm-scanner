<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Attack Map — LLM Security Scanner</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0b0d17;
  color: #e8eaf6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 48px;
  overflow-x: hidden;
}

/* ── Header ───────────────────────────────────────────────────────── */
.header {
  text-align: center;
  margin-bottom: 12px;
}
.header h1 {
  font-size: 1.9rem;
  font-weight: 800;
  background: linear-gradient(135deg, #63b3ed, #9f7aea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}
.header .subtitle {
  font-size: 0.8rem;
  color: #8892b0;
  margin-top: 4px;
}
#target-url {
  font-size: 0.78rem;
  color: #63b3ed;
  margin-top: 6px;
  font-family: monospace;
  opacity: 0.85;
}

/* ── Status badge ─────────────────────────────────────────────────── */
#status-badge {
  display: inline-block;
  margin: 14px auto 0;
  padding: 5px 18px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(99,179,237,0.12);
  border: 1px solid rgba(99,179,237,0.3);
  color: #63b3ed;
  transition: background 0.5s, color 0.5s, border-color 0.5s;
}
#status-badge.scanning {
  background: rgba(251,146,60,0.12);
  border-color: rgba(251,146,60,0.4);
  color: #fb923c;
}
#status-badge.done {
  background: rgba(74,222,128,0.12);
  border-color: rgba(74,222,128,0.4);
  color: #4ade80;
}

/* ── Map container ────────────────────────────────────────────────── */
.map-wrap {
  position: relative;
  width: min(520px, 96vw);
  height: min(520px, 96vw);
  margin: 28px auto 0;
}

/* ── SVG connector lines (sit behind nodes) ───────────────────────── */
.map-wrap svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Target (center) node ─────────────────────────────────────────── */
.center-node {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 88px; height: 88px;
  background: linear-gradient(135deg, #1e2140, #2a2f5e);
  border: 2px solid rgba(99,179,237,0.55);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.68rem;
  font-weight: 700;
  color: #63b3ed;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  box-shadow: 0 0 24px rgba(99,179,237,0.18), 0 0 0 6px rgba(99,179,237,0.06);
  z-index: 2;
}
.center-node .icon { font-size: 1.4rem; margin-bottom: 3px; }

/* ── Category nodes ───────────────────────────────────────────────── */
.cat-node {
  position: absolute;
  width: 86px; height: 86px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.58rem;
  font-weight: 600;
  text-align: center;
  padding: 6px;
  line-height: 1.3;
  cursor: default;
  transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
  z-index: 2;
  transform: translate(-50%, -50%);
}

/* State colours */
.cat-node.pending {
  background: #1a1f35;
  border: 2px solid rgba(136,146,176,0.35);
  color: #8892b0;
  box-shadow: none;
}
.cat-node.testing {
  background: rgba(251,146,60,0.14);
  border: 2px solid #fb923c;
  color: #fb923c;
  box-shadow: 0 0 18px rgba(251,146,60,0.35);
  animation: pulse-ring 1.1s ease-in-out infinite;
}
.cat-node.safe {
  background: rgba(74,222,128,0.12);
  border: 2px solid #4ade80;
  color: #4ade80;
  box-shadow: 0 0 14px rgba(74,222,128,0.25);
}
.cat-node.vulnerable {
  background: rgba(248,113,113,0.14);
  border: 2px solid #f87171;
  color: #f87171;
  box-shadow: 0 0 18px rgba(248,113,113,0.35);
}

@keyframes pulse-ring {
  0%   { box-shadow: 0 0 10px rgba(251,146,60,0.3);  }
  50%  { box-shadow: 0 0 28px rgba(251,146,60,0.65); }
  100% { box-shadow: 0 0 10px rgba(251,146,60,0.3);  }
}

.cat-node .cat-name {
  font-size: 0.54rem;
  text-align: center;
  word-break: break-word;
  hyphens: auto;
  max-width: 72px;
}
.cat-node .cat-findings {
  margin-top: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  opacity: 0.9;
}
.cat-node .cat-state-icon { font-size: 1rem; margin-bottom: 2px; }

/* ── Progress bar ─────────────────────────────────────────────────── */
.progress-section {
  width: min(520px, 96vw);
  margin: 28px auto 0;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: #8892b0;
  margin-bottom: 8px;
}
.progress-track {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #63b3ed, #9f7aea);
  border-radius: 999px;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
  width: 0%;
}

/* ── Completion banner ────────────────────────────────────────────── */
#done-banner {
  display: none;
  margin-top: 22px;
  padding: 14px 28px;
  border-radius: 14px;
  background: rgba(74,222,128,0.10);
  border: 1px solid rgba(74,222,128,0.35);
  color: #4ade80;
  font-size: 0.95rem;
  font-weight: 700;
  text-align: center;
  animation: celebrate 0.6s cubic-bezier(.4,0,.2,1);
}
@keyframes celebrate {
  0%   { transform: scale(0.88); opacity: 0; }
  70%  { transform: scale(1.04); }
  100% { transform: scale(1);    opacity: 1; }
}

/* ── Legend ───────────────────────────────────────────────────────── */
.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 24px;
  font-size: 0.72rem;
  color: #8892b0;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  border: 2px solid;
  flex-shrink: 0;
}
.legend-dot.pending    { background: #1a1f35;              border-color: rgba(136,146,176,0.4); }
.legend-dot.testing    { background: rgba(251,146,60,0.14); border-color: #fb923c; }
.legend-dot.safe       { background: rgba(74,222,128,0.12); border-color: #4ade80; }
.legend-dot.vulnerable { background: rgba(248,113,113,0.14); border-color: #f87171; }

/* ── Waiting spinner ──────────────────────────────────────────────── */
#waiting-msg {
  margin-top: 18px;
  font-size: 0.8rem;
  color: #8892b0;
  text-align: center;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>&#x1F5FA;&#xFE0F; Live Attack Map</h1>
  <div class="subtitle">LLM Security Scanner &mdash; OWASP LLM Top 10</div>
  <div id="target-url">Waiting for scan data&hellip;</div>
  <div id="status-badge">Idle</div>
</div>

<!-- Map -->
<div class="map-wrap" id="map-wrap">
  <svg id="svg-lines"></svg>
  <div class="center-node" id="center-node">
    <span class="icon">&#x1F3AF;</span>
    TARGET
  </div>
  <!-- category nodes injected by JS -->
</div>

<!-- Progress -->
<div class="progress-section">
  <div class="progress-label">
    <span>Overall progress</span>
    <span id="prog-text">0 / 0 payloads</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill"></div>
  </div>
</div>

<!-- Done banner -->
<div id="done-banner">&#x2705; Scan complete! All payloads tested.</div>

<!-- Legend -->
<div class="legend">
  <div class="legend-item"><div class="legend-dot pending"></div> Pending</div>
  <div class="legend-item"><div class="legend-dot testing"></div> Testing</div>
  <div class="legend-item"><div class="legend-dot safe"></div> Safe</div>
  <div class="legend-item"><div class="legend-dot vulnerable"></div> Vulnerable</div>
</div>

<div id="waiting-msg">Start the scanner with <code>--live-map</code> to begin.</div>

<script>
/* ── Constants ──────────────────────────────────────────────────── */
const STATUS_FILE = 'reports/live_status.json';
const POLL_MS     = 1000;

/* ── State ──────────────────────────────────────────────────────── */
let _catOrder   = [];   // ordered category names
let _nodes      = {};   // name -> DOM element
let _initialized = false;
let _done        = false;

/* ── Helpers ────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

function stateIcon(state) {
  const icons = { pending:'&#x23F3;', testing:'&#x26A1;', safe:'&#x2705;', vulnerable:'&#x26A0;&#xFE0F;' };
  return icons[state] || '';
}

/* ── Build the radial layout ────────────────────────────────────── */
function buildMap(categories) {
  const wrap   = $('map-wrap');
  const svg    = $('svg-lines');
  _catOrder    = categories;
  _nodes       = {};

  // Remove old category nodes
  wrap.querySelectorAll('.cat-node').forEach(n => n.remove());
  svg.innerHTML = '';

  const cx = 50, cy = 50;          // % center
  const radius = 38;               // % radius of orbit

  categories.forEach((cat, i) => {
    const angle = (2 * Math.PI * i / categories.length) - (Math.PI / 2);
    const px = cx + radius * Math.cos(angle);  // percent
    const py = cy + radius * Math.sin(angle);

    // SVG line from center to node (in %)
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx + '%');
    line.setAttribute('y1', cy + '%');
    line.setAttribute('x2', px + '%');
    line.setAttribute('y2', py + '%');
    line.setAttribute('stroke', 'rgba(99,179,237,0.18)');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(line);

    // Node div
    const node = document.createElement('div');
    node.className = 'cat-node pending';
    node.id = 'cat-' + i;
    node.style.left = px + '%';
    node.style.top  = py + '%';

    // Shorten long labels for display
    const shortName = cat.replace(/OWASP LLM\d*[:\s]*/i, '').trim().substring(0, 50);

    node.innerHTML =
      '<span class="cat-state-icon">' + stateIcon('pending') + '</span>' +
      '<span class="cat-name">' + escHtml(shortName) + '</span>' +
      '<span class="cat-findings">0 findings</span>';

    wrap.appendChild(node);
    _nodes[cat] = node;
  });
}

/* ── Update a category node ─────────────────────────────────────── */
function updateNode(cat, data) {
  const node = _nodes[cat];
  if (!node) return;

  const prevClass = node.className.split(' ').find(c =>
    ['pending','testing','safe','vulnerable'].includes(c));

  if (prevClass !== data.state) {
    node.classList.remove('pending','testing','safe','vulnerable');
    node.classList.add(data.state);
  }

  const shortName = cat.replace(/OWASP LLM\d*[:\s]*/i, '').trim().substring(0, 50);
  node.innerHTML =
    '<span class="cat-state-icon">' + stateIcon(data.state) + '</span>' +
    '<span class="cat-name">' + escHtml(shortName) + '</span>' +
    '<span class="cat-findings">' + data.findings + ' finding' +
    (data.findings !== 1 ? 's' : '') + '</span>';
}

/* ── Apply a full status object ─────────────────────────────────── */
function applyStatus(s) {
  // Target URL
  $('target-url').textContent = s.target_url || '';

  // Categories: build map on first seen or if order changed
  const cats = Object.keys(s.categories || {});
  if (!_initialized || cats.join() !== _catOrder.join()) {
    buildMap(cats);
    _initialized = true;
  }

  // Update each node
  cats.forEach(cat => updateNode(cat, s.categories[cat]));

  // Progress
  const prog = s.overall_progress || { tested: 0, total: 0 };
  const pct  = prog.total > 0 ? Math.round(100 * prog.tested / prog.total) : 0;
  $('prog-fill').style.width = pct + '%';
  $('prog-text').textContent = prog.tested + ' / ' + prog.total + ' payloads';

  // Status badge
  const badge = $('status-badge');
  if (s.finished) {
    badge.textContent = 'Scan complete';
    badge.className = 'done';
  } else if (prog.tested > 0 || cats.some(c => s.categories[c].state !== 'pending')) {
    badge.textContent = 'Scanning\u2026';
    badge.className = 'scanning';
  } else {
    badge.textContent = 'Initialising\u2026';
    badge.className = '';
  }

  // Done banner
  if (s.finished && !_done) {
    _done = true;
    $('done-banner').style.display = 'block';
    $('waiting-msg').style.display = 'none';
  }
  if (!s.finished) {
    $('waiting-msg').style.display = 'none';
  }
}

/* ── XSS-safe escaping ──────────────────────────────────────────── */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Polling loop ───────────────────────────────────────────────── */
async function poll() {
  try {
    const r = await fetch(STATUS_FILE + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      applyStatus(data);
    }
  } catch (_) {
    // Network/parse error -- silently skip this cycle
  }
  setTimeout(poll, POLL_MS);
}

/* ── Boot ───────────────────────────────────────────────────────── */
poll();
</script>
</body>
</html>

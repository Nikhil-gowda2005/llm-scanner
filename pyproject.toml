[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-scanner"
version = "0.3.0"
description = "Black-box security scanner for LLM chatbots — OWASP LLM Top 10 red-teaming CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "LLM Scanner Contributors" }]
keywords = ["llm", "security", "scanner", "owasp", "red-team", "jailbreak", "prompt-injection", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
web = [
    "flask>=3.0.0",
]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.4",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Nikhil-gowda2005/llm-scanner"
Issues   = "https://github.com/Nikhil-gowda2005/llm-scanner/issues"

[project.scripts]
llm-scanner        = "cli:main"
llm-scanner-web    = "web_app:main"
llm-scanner-config = "config_cmd:main"

# ─── Package discovery ────────────────────────────────────────────────────────
[tool.setuptools]
py-modules = ["cli", "web_app", "config_cmd"]

[tool.setuptools.packages.find]
include = ["core*", "detectors*", "reporters*", "scripts*", "payloads*"]

[tool.setuptools.package-data]
"*" = [
    "payloads/*.yaml",
    "templates/*.html",
    "templates/*.j2",
]

# ─── Ruff linter config ───────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line too long — handled by formatter

# ─── Black formatter config ───────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py39"]
